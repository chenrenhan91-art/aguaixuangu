name: Refresh A-Share Snapshot

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Force refresh even when the current day is not an A-share trading day
        required: false
        default: false
        type: boolean
      session_target:
        description: Force the snapshot session label for manual/backstop runs
        required: false
        default: auto
        type: choice
        options:
          - auto
          - midday
          - close
  workflow_call:
    inputs:
      force_refresh:
        required: false
        type: boolean
        default: false
      session_target:
        required: false
        type: string
        default: auto
  repository_dispatch:
    types: [refresh-snapshot]
  schedule:
    # GitHub Actions scheduled workflows are best-effort and routinely delayed
    # 10-30 minutes (or skipped entirely) during peak hours. We do not run a
    # pre-11:30 snapshot: midday analysis starts only after the morning session
    # closes, then retries through the lunch break so the first successful
    # midday snapshot is pushed before the 13:30 afternoon open whenever GitHub
    # runners are available. Close refresh starts at 15:05 after the close.
    # Beijing 11:31 (primary midday, after morning session close)
    - cron: "31 3 * * 1-5"
    # Beijing 11:36 (midday retry #1)
    - cron: "36 3 * * 1-5"
    # Beijing 11:45 (midday retry #2)
    - cron: "45 3 * * 1-5"
    # Beijing 12:00 (midday retry #3)
    - cron: "0 4 * * 1-5"
    # Beijing 12:20 (midday retry #4)
    - cron: "20 4 * * 1-5"
    # Beijing 12:40 (midday retry #5)
    - cron: "40 4 * * 1-5"
    # Beijing 12:55 (midday retry #6 – low-traffic fallback)
    - cron: "55 4 * * 1-5"
    # Beijing 13:10 (midday retry #7 – final full retry before afternoon open)
    - cron: "10 5 * * 1-5"
    # Beijing 13:25 (midday watchdog – usually fast-paths if the snapshot exists)
    - cron: "25 5 * * 1-5"
    # Beijing 15:05 (primary close, after continuous auction close)
    - cron: "5 7 * * 1-5"
    # Beijing 15:10 (close retry #1)
    - cron: "10 7 * * 1-5"
    # Beijing 15:20 (close retry #2)
    - cron: "20 7 * * 1-5"
    # Beijing 15:45 (close retry #3)
    - cron: "45 7 * * 1-5"
    # Beijing 16:10 (close retry #4 – catches delayed runners)
    - cron: "10 8 * * 1-5"
    # Beijing 17:10 (close watchdog)
    - cron: "10 9 * * 1-5"
    # Beijing 18:10 (late close watchdog)
    - cron: "10 10 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: refresh-a-share-snapshot
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      A_SHARE_FORCE_REFRESH: ${{ (((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.force_refresh == true || inputs.force_refresh == 'true')) || (github.event_name == 'repository_dispatch' && (github.event.client_payload.force_refresh == true || github.event.client_payload.force_refresh == 'true'))) && '1' || '0' }}
      A_SHARE_SNAPSHOT_SESSION_TARGET: ${{ (((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.session_target != 'auto') && inputs.session_target) || (github.event_name == 'repository_dispatch' && (github.event.client_payload.session_target || github.event.client_payload.snapshot_session)) || '' }}
      # Keep per-trade-date snapshots so the frontend can show recent history.
      A_SHARE_WRITE_DATED_SNAPSHOT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Print trigger context
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Force refresh: $A_SHARE_FORCE_REFRESH"
          echo "Session target: ${A_SHARE_SNAPSHOT_SESSION_TARGET:-auto}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: Check A-share trading calendar
        id: calendar
        run: |
          python -m data_pipeline.jobs.check_trade_day --github-output "$GITHUB_OUTPUT"
          echo "--- GITHUB_OUTPUT ---"
          cat "$GITHUB_OUTPUT" || true

      - name: Print refresh gate
        run: |
          echo "Trade date: ${{ steps.calendar.outputs.trade_date }}"
          echo "Trade day: ${{ steps.calendar.outputs.is_trade_day }}"
          echo "Source: ${{ steps.calendar.outputs.calendar_source }}"
          echo "Reason: ${{ steps.calendar.outputs.calendar_reason }}"

      - name: Generate latest selector snapshot
        if: steps.calendar.outputs.is_trade_day == 'true'
        run: python -m data_pipeline.jobs.generate_daily_candidates

      - name: Validate latest selector snapshot
        if: steps.calendar.outputs.is_trade_day == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/processed/daily_candidates_latest.json")
          if not path.exists():
              raise SystemExit("latest snapshot file is missing")

          payload = json.loads(path.read_text(encoding="utf-8"))
          from data_pipeline.jobs.generate_daily_candidates import _validate_snapshot

          _validate_snapshot(payload)

          expected_session = os.environ.get("A_SHARE_SNAPSHOT_SESSION_TARGET", "")
          actual_session = (payload.get("snapshot_session") or {}).get("session_id", "")
          if expected_session in {"midday", "close"} and actual_session != expected_session:
              raise SystemExit(
                  f"snapshot session mismatch: expected {expected_session}, got {actual_session}"
              )

          print("Snapshot validation passed.")
          PY

      - name: Print snapshot summary
        if: steps.calendar.outputs.is_trade_day == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed/daily_candidates_latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          scan_summary = payload.get("selection_meta", {}).get("scan_summary", [])

          print("Trade date:", payload.get("trade_date"))
          print("Generated at:", payload.get("generated_at"))
          print("Default mode:", payload.get("default_mode"))
          print("Candidate count:", len(payload.get("candidate_pool", [])))
          print("Top symbols:", [item.get("symbol") for item in payload.get("candidate_pool", [])])
          print("Industry source:", payload.get("selection_meta", {}).get("industry_source"))
          print("Constituent sources:", sorted({item.get("data_source", "unknown") for item in scan_summary}))
          PY

      - name: Skip refresh when market is closed
        if: steps.calendar.outputs.is_trade_day != 'true'
        run: echo "Skip refresh because the market is closed."

      - name: Rebuild history index & prune old dated snapshots
        if: steps.calendar.outputs.is_trade_day == 'true'
        env:
          HISTORY_RETENTION: "10"
        run: python -m data_pipeline.jobs.rebuild_snapshot_history

      - name: Commit changes if needed
        if: steps.calendar.outputs.is_trade_day == 'true'
        run: |
          # Use -A so pruned (deleted) files are also staged for removal,
          # preventing stale snapshots from accumulating in git history.
          # Also stage the per-day event cache so later cron retries can
          # reuse it without re-fetching (saves ~3 min when run-1 timed out).
          git add -A data/processed/
          if [ -d data/raw/stock_events_cache ]; then
            find data/raw/stock_events_cache -type f -name '*.json' -exec git add -f {} +
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh selector snapshot"
          git push || {
            echo "Initial push was rejected; rebasing onto latest main and retrying once."
            git fetch origin main
            git pull --rebase --autostash origin main
            git push
          }
