name: Refresh A-Share Midday Snapshot

on:
  workflow_dispatch:
  schedule:
    # Independent midday backstop workflow.  GitHub scheduled workflows can skip
    # an entire schedule batch; this separate workflow calls the same generator
    # with an explicit midday target so a missed primary schedule has another
    # chance before the 13:30 afternoon open.
    # Beijing 11:32 (primary backstop, after morning session close)
    - cron: "32 3 * * 1-5"
    # Beijing 11:38
    - cron: "38 3 * * 1-5"
    # Beijing 11:48
    - cron: "48 3 * * 1-5"
    # Beijing 12:08
    - cron: "8 4 * * 1-5"
    # Beijing 12:28
    - cron: "28 4 * * 1-5"
    # Beijing 12:48
    - cron: "48 4 * * 1-5"
    # Beijing 13:08
    - cron: "8 5 * * 1-5"
    # Beijing 13:23 (last backstop before afternoon open)
    - cron: "23 5 * * 1-5"

permissions:
  contents: write

jobs:
  refresh-midday:
    uses: ./.github/workflows/refresh_snapshot.yml
    permissions:
      contents: write
    with:
      session_target: midday